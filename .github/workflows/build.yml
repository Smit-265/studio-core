# build.yml - DOCUMENTED STUB. It does not export anything, by design.
#
# WHY THIS IS A STUB
#
# A Godot headless export needs `export_presets.cfg`: platform targets, feature
# tags, binary names, signing identities, and per-platform texture formats.
# Every one of those is game-specific, and studio-core has no game and no
# project.godot. A workflow here could only either guess at presets that belong
# to a repo it cannot see, or carry a fake project to export - both of which
# make the file lie about what it does.
#
# So this workflow does one honest thing: it tells you what to put in the game
# repo's own build.yml. Copy the commented job below into `game-<name>` and fill
# in the presets. The verify.yml in this repo is the part that generalises;
# export is not.
#
# The trigger is left as workflow_dispatch so a curious click reports the
# situation rather than silently succeeding at nothing.

name: build (stub)

on:
  workflow_dispatch:

env:
  GODOT_VERSION: "4.7.1"

jobs:
  explain:
    name: explain why there is nothing to build here
    runs-on: ubuntu-latest
    steps:
      - name: Report
        run: |
          echo "studio-core is a harness, not a game. There is no project.godot"
          echo "and no export_presets.cfg here, so there is nothing to export."
          echo
          echo "Export belongs in the game repo. See the commented template in"
          echo ".github/workflows/build.yml in this repository."

